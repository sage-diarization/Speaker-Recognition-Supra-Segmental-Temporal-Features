device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 5                # independent train/test runs per strategy to average EER mean+SD over (Neururer et al. 2024 Section 2.3)

data:
  dataset: "AISHELL4"      # see src/README.md's "Running on AISHELL-4" section for the protocol this implies
  segment_duration: 1.0

aishell4:
  # An already-extracted AISHELL-4 (openslr.org/111) directory tree,
  # containing train_S/, train_M/ and/or train_L/, plus test/, each with
  # wav/ and TextGrid/ subdirectories. This project doesn't auto-download
  # it -- see src/data/aishell4.py's module docstring.
  root: "~/.cache/datasets/aishell4"

model:
  type: "ResNet"

# ResNet34s's original front-end (context/src/00_configs/01_transformation/ResNet.json):
# a raw (non-mel) magnitude spectrogram with a hamming window -- different
# from CNN/RNN's mel front-end, per Neururer et al. 2024's stated policy of
# keeping each model's own original recipe for comparability with prior work.
transformation:
  type: "linear"
  window: "hamming"
  nfft: 512
  frame_length_s: 0.025
  frame_step_s: 0.01

resnet:
  vlad_clusters: 10
  ghost_clusters: 2
  bottleneck: 512

loss:
  type: "ANGULAR_MARGIN"

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0002    # 2x RES34S.json's WEIGHT_DECAY: Keras l2(1e-4) = 2e-4 * w gradient (see src/config.py)

training:
  num_epochs: 128
  batch_size: 100
  # checkpoint_dir defaults to "checkpoints" (repo root, shared across compute
  # nodes) -- /scratch is wiped at job termination, so it can't hold resume
  # state across a requeue.
  checkpoint_every_epochs: 1
  early_stopping_patience: 10
  early_stopping_min_improvement_rate: 0.03

wandb:
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"  # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: []
