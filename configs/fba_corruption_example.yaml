# Example configuration with FBA corruption augmentation (Strategy 1)
# This forces models to rely on SST features by making spectral cues unreliable

# To use: python -m src.experiment --config configs/fba_corruption_example.yaml

model:
  type: CNN  # or RNN, ResNet, Conformer

data:
  dataset: TIMIT  # or VoxCeleb, TidyVoiceX
  segment_duration: 1.0

transformation:
  sample_rate: 16000
  frame_length_s: 0.064
  frame_step_s: 0.01
  nfft: 1024
  n_mels: 128
  type: mel
  window: hann

training:
  num_epochs: 128
  batch_size: 100
  num_workers: 0
  
  # FBA Corruption Configuration (Strategy 1)
  # Set enabled: true to activate spectral corruption augmentation
  fba_corruption:
    enabled: true              # Master switch
    probability: 0.5           # Probability of applying corruption to each training sample
    
    # Formant shift: alters spectral envelope (simulated on spectrogram frequency bins)
    # Set to [0, 0] to disable
    formant_shift_range: [-2.0, 2.0]  # Range in semitones
    
    # Additive noise: adds random noise to spectrogram
    # Set to [0, 0] to disable
    noise_std_range: [0.05, 0.15]  # Range of noise standard deviation
    
    # Spectral inversion: reverses frequency bins
    # Probability of applying this transformation (0.0 to 1.0)
    spectral_invert_probability: 0.0

# To run without corruption (original behavior), either:
# 1. Set enabled: false, or
# 2. Remove the fba_corruption section entirely, or
# 3. Set probability: 0

# For stronger FBA degradation (more likely to force SST reliance):
# fba_corruption:
#   enabled: true
#   probability: 0.8
#   formant_shift_range: [-3.0, 3.0]
#   noise_std_range: [0.1, 0.2]
#   spectral_invert_probability: 0.5

# For testing: start with mild settings and increase if no SST reliance is observed
