device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 3                # independent train/test runs per strategy to average EER mean+SD over (Neururer et al. 2024 Section 2.3)

data:
  dataset: "VoxCeleb"      # see src/README.md's "Running on VoxCeleb" section for the protocol this implies
  segment_duration: 1.0

voxceleb:
  root: "~/.cache/datasets/voxceleb"   # fetched via torchaudio's VoxCeleb1Verification downloader on first use
  # trial_meta_url must stay the *original* 40-held-out-speaker list -- see
  # src/data/voxceleb.py's module docstring for why the "hard"/"extended"
  # VoxSRC lists don't work with this project's VoxCeleb1-only substitute
  # protocol (train/eval speaker overlap).
  trial_meta_url: "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/veri_test2.txt"

model:
  type: "CNN"

loss:
  type: "ANGULAR_MARGIN"

training:
  num_epochs: 128
  batch_size: 100
  # checkpoint_dir defaults to "checkpoints" (repo root, shared across compute
  # nodes) -- /scratch is wiped at job termination, so it can't hold resume
  # state across a requeue.
  checkpoint_every_epochs: 1
  early_stopping_patience: 10
  early_stopping_min_improvement_rate: 0.03

wandb:
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"  # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: []
