device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 3                # runs differ only in the seeds of the test draws (the model is fixed)

# The SST bracket study (see src/README.md) of an externally pretrained
# speaker-verification model, only evaluated (training.num_epochs 0), see
# src/models/pretrained_*.py.
data:
  dataset: "VoxCeleb"      # see src/README.md's "Running on VoxCeleb" section for the protocol this implies
  segment_duration: 2.0    # test windows (the CNN/Conformer SST runs use 2 s)

voxceleb:
  root: "~/.cache/datasets/voxceleb1"   # VoxCeleb1, fetched via torchaudio's VoxCeleb1Verification downloader on first use
  trial_meta_url: "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/veri_test2.txt"
  eval_trial_meta_url: "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/list_test_hard2.txt"  # reported SV

# The model's first frame grid, what the test draws shuffle (see TransformationConfig.type).
transformation:
  type: "wespeaker_fbank"
  frame_length_s: 0.025
  frame_step_s: 0.01

model:
  type: "WeSpeakerResNet34"

pretrained:
  checkpoint: "Wespeaker/wespeaker-voxceleb-resnet34-LM:avg_model"   # VoxCeleb2, large-margin fine-tuned

training:
  num_epochs: 0            # pretrained: evaluation only
  strategies: [OS]         # only names the sweep: nothing is trained
  # Test utterances are featurized in worker processes -- match the SLURM
  # jobs' --cpus-per-task.
  num_workers: 32

evaluation:
  # BS{b}: plain block shuffle, for U(b). GO{b}/GS{b}: blocks with gaps of
  # evaluation.sst_gap_s in original/shuffled order, for L(b)
  # (see src/experiment.py's sst_bracket). GC{b}/OC{b}: the same span's frames
  # in one cut / its contiguous middle, for comparing against OS at equal
  # input. One frame per 10 ms: blocks of
  # 4/8/16/32/64 frames span 55/95/175/335/655 ms of signal.
  # GO{b}N8/GS{b}N8/OC{b}N8: 8 blocks of b frames (16 to 512 frames), so 7
  # joins for every b: against GO{b}/GS{b}'s fixed 196-frame window (97 to 3
  # joins), they tell the block width apart from the number of joins.
  test_strategies: [OS, SS, BS4, BS8, BS16, BS32, BS64, GO2, GS2, GC2, OC2, GO4, GS4, GC4, OC4, GO8, GS8, GC8, OC8, GO16, GS16, GC16, OC16, GO32, GS32, GC32, OC32, GO64, GS64, GC64, OC64, GO2N8, GS2N8, OC2N8, GO4N8, GS4N8, OC4N8, GO8N8, GS8N8, OC8N8, GO16N8, GS16N8, OC16N8, GO32N8, GS32N8, OC32N8, GO64N8, GS64N8, OC64N8]
  # Quality checks of the bracket (see src/README.md's "SST bracket"): paired
  # trial-bootstrap intervals, and every GS{b} scored with a second seed.
  sst_bootstrap_resamples: 200
  sst_placebo: true
  # Gaps of at least 590 ms (59 frames) for every b: the smallest swept gap at which GO{b}'s joins
  # are as rough as GS{b}'s for every b (median, quartiles and share of rougher
  # joins), on the extended utterances (doc/join-roughness-gap-sweep.ipynb).
  sst_gap_s: 0.59
  # Every b spreads its blocks over the same 59.19 s, the span GO2 needs with
  # gaps of 590 ms (196 + 97 * 59 frames): larger b get larger gaps, so all
  # draw their frames from the same stretch of the extended utterance.
  sst_span_s: 59.19
  # GO/GS/GC/OC on the utterance followed by the rest of its video, as the
  # sweep validated (same-video trials left out), and all on the trials long
  # enough for that span, so they compare across b.
  sst_extended_utterances: true
  sst_shared_trials: true

wandb:
  run_postfix: 2s-span     # a new sweep: the fixed-gap results of "2s" stay as they are
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"  # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: [pretrained]
