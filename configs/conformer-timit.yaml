device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 5                # independent train/test runs per strategy to average EER/MR mean+SD over (Neururer et al. 2024 Section 2.3)

data:
  timit_root: "~/.cache/datasets/timit"          # path to an already-extracted TIMIT TRAIN/TEST tree
  # archive_path: "" # or a local .zip of your own licensed TIMIT copy
  # download_url: "" # or a URL to YOUR OWN hosted copy (see src/README.md)
  # cache_dir: "~/.cache/datasets/timit"
  segment_duration: 1.0

model:
  type: "Conformer"

conformer:
  encoder_dim: 144        # Gulati et al. 2020 Conformer(S) dimension
  num_layers: 4            # paper uses 16 for LibriSpeech ASR; scaled down for TIMIT-scale segments
  num_heads: 4
  ff_expansion_factor: 4
  conv_kernel_size: 31     # must be odd; paper's Table 1 rounds this to 32
  dropout: 0.1
  use_relative_positional_encoding: true

loss:
  type: "ANGULAR_MARGIN"

training:
  # Only the paper's 11 evaluated epochs (np.linspace(0, 127, 11)) are
  # best-checkpoint candidates, as in context/src's EvalCallback.
  paper_checkpoint_epochs: true
  num_epochs: 128
  batch_size: 100
  # checkpoint_dir defaults to "checkpoints" (repo root, shared across compute
  # nodes) -- /scratch is wiped at job termination, so it can't hold resume
  # state across a requeue.
  # checkpoint_every_epochs and early_stopping_patience default to unset
  # (no periodic checkpoints beyond best/final, early stopping disabled) --
  # left at that default here, override if needed.

evaluation:
  # Checkpoint selection set: the standard 50-speaker TIMIT development set
  # (all TEST split, disjoint from TRAIN and from the 24-speaker core test set;
  # Kaldi egs/timit/s5/conf/dev_spk.list) -- the closest match to context/src's
  # "development" SV list (00_configs/04_evaluation/TIMIT-00_ORIGINAL.json),
  # whose file isn't in the reference repo. SV is still reported on all of TEST.
  dev_speakers: [
      "FAKS0", "FDAC1", "FJEM0", "MGWT0", "MJAR0", "MMDB1", "MMDM2", "MPDF0",
      "FCMH0", "FKMS0", "MBDG0", "MBWM0", "MCSH0", "FADG0", "FDMS0", "FEDW0",
      "MGJF0", "MGLB0", "MRTK0", "MTAA0", "MTDT0", "MTHC0", "MWJG0", "FNMR0",
      "FREW0", "FSEM0", "MBNS0", "MMJR0", "MDLS0", "MDLF0", "MDVC0", "MERS0",
      "FMAH0", "FDRW0", "MRCS0", "MRJM4", "FCAL1", "MMWH0", "FJSJ0", "MAJC0",
      "MJSW0", "MREB0", "FGJD0", "FJMG0", "MROA0", "MTEB0", "MJFC0", "MRJR0",
      "FMML0", "MRWS1"
  ]
  sc_num_speakers: 40
  # The paper's 40 SC speakers (15 female / 25 male, all TIMIT TEST), from its
  # reference [13]'s github.com/stdm/ZHAW_deep_voice
  # common/data/speaker_lists/timit_speakers_40_clustering_vs_reynolds.txt
  sc_speakers: [
      "MPGL0", "MSTK0", "FCMR0", "MWBT0", "MCEM0", "MRGG0", "MBJK0", "MPDF0",
      "MDAB0", "MMDM2", "MGWT0", "FDAC1", "FPKT0", "FJAS0", "MCCS0", "MMDB1",
      "MDLD0", "MJAR0", "FAKS0", "FELC0", "MTAS1", "MSJS1", "FJEM0", "MWEW0",
      "MREB0", "FJRE0", "MWVW0", "FRAM1", "MRCZ0", "MABW0", "FCMH0", "MRJO0",
      "FPAS0", "FJWB0", "FDRD1", "MJSW0", "FKMS0", "FSLB1", "MTMR0", "MDBB0"
  ]

wandb:
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"              # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: []
