device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 5                # independent train/test runs per strategy to average EER mean+SD over (Neururer et al. 2024 Section 2.3)

data:
  dataset: "TidyVoiceX"    # see src/README.md's "Running on TidyVoiceX" section for the protocol this implies
  segment_duration: 1.0

tidyvoicex:
  # An already-extracted TidyVoiceX_ASV (Mozilla Data Collective) tree,
  # searched for its *_Train/ and *_Dev/ directories -- not auto-downloaded,
  # see src/data/tidyvoicex.py's module docstring.
  root: "~/.cache/datasets/tidyvoicex"
  # The Dev trial list ships separately (tidyvoice_trials.zip); "" searches
  # root for TidyVocieX_Dev_trialPairs.txt (sic). Absolute or root-relative.
  trial_file: ""

model:
  type: "ResNet"

# No transformation section: the default mel front-end shared with the
# CNN/RNN/Conformer configs (not ResNet34s's original linear spectrogram,
# context/src/00_configs/01_transformation/ResNet.json), so its numbers are
# directly comparable to theirs.

resnet:
  vlad_clusters: 10
  ghost_clusters: 2
  bottleneck: 512

loss:
  type: "ANGULAR_MARGIN"

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0002    # 2x RES34S.json's WEIGHT_DECAY: Keras l2(1e-4) = 2e-4 * w gradient (see src/config.py)

training:
  num_epochs: 128
  batch_size: 100
  # checkpoint_dir defaults to "checkpoints" (repo root, shared across compute
  # nodes) -- /scratch is wiped at job termination, so it can't hold resume
  # state across a requeue.
  checkpoint_every_epochs: 1
  early_stopping_patience: 10
  early_stopping_min_improvement_rate: 0.03

wandb:
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"  # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: []
