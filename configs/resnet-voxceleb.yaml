device: "auto"            # "auto" picks cuda > mps > cpu; set explicitly (e.g. "cpu") to override
num_runs: 5                # independent train/test runs per strategy to average EER mean+SD over (Neururer et al. 2024 Section 2.3)

data:
  dataset: "VoxCeleb"      # see src/README.md's "Running on VoxCeleb" section for the protocol this implies
  segment_duration: 1.0

# Neururer et al. 2024's protocol (Section 3.2, context/src's
# 04_evaluation/VOX-00_ORIGINAL.json): train on VoxCeleb2 dev, select
# checkpoints on VoxCeleb1-O (cleaned), report SV on VoxCeleb1-H (cleaned).
# Remove vox2_root and eval_trial_meta_url for the VoxCeleb1-only substitute
# (see src/README.md's "Running on VoxCeleb").
voxceleb:
  root: "~/.cache/datasets/voxceleb1"   # VoxCeleb1, fetched via torchaudio's VoxCeleb1Verification downloader on first use
  vox2_root: "~/.cache/datasets/voxceleb2"   # VoxCeleb2 dev as 16 kHz WAV, downloaded + converted manually
  trial_meta_url: "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/veri_test2.txt"          # checkpoint selection
  eval_trial_meta_url: "https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/list_test_hard2.txt"  # reported SV

model:
  type: "ResNet"

# ResNet34s's original front-end (context/src/00_configs/01_transformation/ResNet.json):
# a raw (non-mel) magnitude spectrogram with a hamming window -- different
# from CNN/RNN's mel front-end, per Neururer et al. 2024's stated policy of
# keeping each model's own original recipe for comparability with prior work.
transformation:
  type: "linear"
  window: "hamming"
  nfft: 512
  frame_length_s: 0.025
  frame_step_s: 0.01

resnet:
  vlad_clusters: 10
  ghost_clusters: 2
  bottleneck: 512

loss:
  type: "ANGULAR_MARGIN"

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0002    # 2x RES34S.json's WEIGHT_DECAY: Keras l2(1e-4) = 2e-4 * w gradient (see src/config.py)

training:
  num_epochs: 128
  batch_size: 100
  # checkpoint_dir defaults to "checkpoints" (repo root, shared across compute
  # nodes) -- /scratch is wiped at job termination, so it can't hold resume
  # state across a requeue.
  checkpoint_every_epochs: 1
  # As in the paper: the full 128 epochs (no early stopping), best checkpoint
  # among the 11 evaluated ones (np.linspace(0, 127, 11)).
  paper_checkpoint_epochs: true
  # Training segments are read from disk per draw -- match the SLURM jobs'
  # --cpus-per-task.
  num_workers: 8

wandb:
  enabled: true          # set true to track runs (needs `wandb login` or WANDB_API_KEY, unless mode is offline/disabled)
  project: "speaker-verification"
  entity: "marbetschar-zhaw"  # your wandb entity/team, "" = your default
  mode: "online"           # "offline" for SLURM compute nodes without internet (sync later with `wandb sync`)
  tags: []
